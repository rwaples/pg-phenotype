# pg-phenotype development environment (simACE family ADR 0018): a
# self-contained locked env installing this repo editable with its test +
# typecheck extras.  Consumers install the PyPI wheel.
[workspace]
name = "pg-phenotype"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.82,<0.83"

[dependencies]
python = "3.14.*"
pip = "*"
rust = ">=1.85"
maturin = ">=1.15.0,<2"

[pypi-dependencies]
pg-phenotype = { path = ".", editable = true, extras = ["test", "typecheck"] }

[tasks]
# `build-dev` rebuilds the editable extension with the `test-hooks` feature;
# PG_PHENOTYPE_REQUIRE_TEST_HOOKS=1 makes the panic-boundary test fail rather
# than skip when the hook is missing.
build-dev = "maturin develop --release --features test-hooks"
test = { cmd = "pytest -n 6 --dist worksteal -m 'not slow'", depends-on = ["build-dev"], env = { PG_PHENOTYPE_REQUIRE_TEST_HOOKS = "1" } }
test-all = { cmd = "pytest -n 6 --dist worksteal", depends-on = ["build-dev"], env = { PG_PHENOTYPE_REQUIRE_TEST_HOOKS = "1" } }
test-rust = "cargo test --release"
# `ci-local` runs the checks the CI push jobs run (.github/workflows/ci.yml),
# before a push. CI-only: the Python 3.13 job, the offline R tarball check
# (needs sudo unshare), the pedigree-graph main job (`test-against-pg`), and the
# publish workflow's macOS/Windows/ARM legs, so float comparisons in tests need
# a tolerance.
lint-rust = "cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings"
lint-python = "ruff check && ruff format --check && ty check"
ci-local = { depends-on = ["lint-rust", "test-rust", "lint-python", "test-all", { task = "ci-r", environment = "r" }] }
# Rebuild against a candidate pedigree-graph checkout and run every suite.
test-against-pg = "tools/test_against_pg.sh"

[feature.r.dependencies]
r-base = "4.5.*"
r-testthat = ">=3.2"
# Aalen-Johansen oracle for the CIP gate (survfit with a factor status).
r-survival = "*"
r-roxygen2 = "*"
c-compiler = "*"
make = "*"

[feature.r.tasks]
r-install = { cmd = "R CMD INSTALL --no-multiarch --preclean r", env = { PG_PHENOTYPE_CARGO_FEATURES = "test-hooks" } }
r-doc = "Rscript -e 'roxygen2::roxygenise(\"r\", roclets = \"rd\")'"
r-test = { cmd = "Rscript -e 'testthat::test_local(\"r\", stop_on_failure = TRUE)'", depends-on = ["r-install"], env = { PG_PHENOTYPE_REQUIRE_TEST_HOOKS = "1" } }
# The binding crate under r/src/rust builds only in this env: outside it, extendr's
# build script finds no R and caches the failure (`cargo clean -p extendr-api -p
# extendr-ffi` clears it).
lint-r-rust = { cmd = "cargo fmt --check && cargo clippy --release --all-targets --all-features -- -D warnings", cwd = "r/src/rust" }
ci-r = { depends-on = ["lint-r-rust", "r-test"] }

[environments]
r = { features = ["r"], no-default-feature = false }
