[workspace]
resolver = "2"
members = ["crates/core", "crates/python"]

[workspace.package]
version = "0.6.1"
edition = "2021"
# pedigree-graph-core's floor; the R binding crate states the same.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rwaples/pg-phenotype"

[workspace.dependencies]
# Re-pinned on purpose only (ADR 0001): pg-core is unpublished until 1.0.
# This rev is pedigree-graph's main (7c533dd: the relationships::query module,
# pedigree-graph #52; the one-parent-role rule, #58; a moments table that
# carries its symmetric rule, #55; and caller-given texts in error fields,
# #60); re-pin to the release tag that carries it.
pedigree-graph-core = { git = "https://github.com/rwaples/pedigree-graph", rev = "7c533dd81c245ee996bd73af137e4bd1462c0404" }
rayon = "1.10"
rustc-hash = "2.1"

# No user-reachable panics (ADR 0007): input errors are error values the
# hosts raise, never panics.  A surviving `expect` / `unreachable!` names the
# internal invariant it relies on in an `#[expect(..., reason)]`.  `assert!`
# stays allowed: it states an invariant the caller already checked, and a
# failure is a bug the bindings surface as an exception rather than an abort.
# Test code is exempt through clippy.toml.  r/src/rust/Cargo.toml repeats
# this table (it is its own workspace); tests/test_version.py
# fails when the two differ.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 1
