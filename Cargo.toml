[workspace]
resolver = "2"
members = ["crates/core", "crates/python"]

[workspace.package]
version = "0.1.1"
edition = "2021"
# pedigree-graph-core's floor; the R binding crate states the same.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rwaples/pg-phenotype"

[workspace.dependencies]
# Re-pinned on purpose only (ADR 0001): pg-core is unpublished until 1.0.
# This rev is pedigree-graph's pg-core-smells branch on v0.12.2: the core
# takes a Receiver instead of a view map and a compact flag.
pedigree-graph-core = { git = "https://github.com/rwaples/pedigree-graph", rev = "66595d3371d2f8c68622b7b98f597af56818a77c" }
rayon = "1.10"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 1
